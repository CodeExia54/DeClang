name: Build Clang for Android ARM64

on: workflow_dispatch

jobs:
  build-clang-android:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout DeClang
      uses: actions/checkout@v4
      with:
        repository: DeNA/DeClang
        ref: Android-v1.0.0
        submodules: recursive
        
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          ninja-build \
          python3 \
          libtinfo5 \
          libncurses5
        
    - name: Setup AntiHackOSS Symlinks
      run: |
        echo "=== Setting up OLLVM symlinks ==="
        
        rm -f clang/lib/Driver/DeClangExtraProcess.cpp 2>/dev/null || true
        rm -f llvm/lib/Transforms/AntiHack 2>/dev/null || true
        rm -f llvm/include/llvm/Transforms/AntiHack 2>/dev/null || true
        rm -f tools 2>/dev/null || true
        
        ln -sf ../../../AntiHackOSS/clang/DeClangExtraProcess.cpp clang/lib/Driver/DeClangExtraProcess.cpp
        ln -sf ../../../AntiHackOSS/src llvm/lib/Transforms/AntiHack
        ln -sf ../../../../AntiHackOSS/include llvm/include/llvm/Transforms/AntiHack
        ln -sf AntiHackOSS/tools tools
        
    - name: Build Clang Only
      run: |
        echo "=== Building clang for Android ARM64 ==="
        
        cd llvm
        mkdir -p build && cd build
        
        cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DLLVM_ENABLE_PROJECTS="clang" \
          -DLLVM_TARGETS_TO_BUILD="AArch64" \
          -DLLVM_DEFAULT_TARGET_TRIPLE="aarch64-linux-android21" \
          -DLLVM_ENABLE_RUNTIMES="compiler-rt" \
          -DLLVM_INCLUDE_TESTS=OFF \
          -DLLVM_INCLUDE_EXAMPLES=OFF \
          -G "Ninja"
        
        ninja clang
        
        echo "✅ Clang build complete!"
        
    - name: Test Android Support
      run: |
        echo "=== Testing Android ARM64 support ==="
        
        if [ -f "llvm/build/bin/clang" ]; then
          CLANG_BIN="llvm/build/bin/clang"
          
          echo "Clang version:"
          $CLANG_BIN --version
          
          echo ""
          echo "Testing Android ARM64 target:"
          $CLANG_BIN --target=aarch64-linux-android21 --version 2>&1 | head -3 && \
            echo "✅ Android ARM64 supported" || echo "❌ Android ARM64 not supported"
            
          echo ""
          echo "Testing OLLVM flags:"
          echo 'int main(){return 0;}' | \
            $CLANG_BIN -x c -c - -o /dev/null \
            -mllvm -fla \
            -mllvm -bcf \
            -mllvm -sub 2>&1 | grep -i "error" || \
            echo "✅ OLLVM flags accepted"
        else
          echo "❌ Clang binary not found"
        fi
        
    - name: Create Android Toolchain
      run: |
        echo "=== Creating Android toolchain ==="
        
        mkdir -p android-toolchain/bin
        
        if [ -f "llvm/build/bin/clang" ]; then
          cp llvm/build/bin/clang android-toolchain/bin/
          
          if [ -f "llvm/build/bin/clang++" ]; then
            cp llvm/build/bin/clang++ android-toolchain/bin/
          fi
          
          cat > android-toolchain/bin/android-clang << 'EOF'
#!/bin/bash
# Android ARM64 compiler wrapper
DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
exec "$DIR/clang" --target=aarch64-linux-android21 "$@"
EOF
          
          chmod +x android-toolchain/bin/android-clang
          
          tar czf declang-android-arm64.tar.gz android-toolchain/
          echo "✅ Package created: declang-android-arm64.tar.gz"
        else
          echo "❌ Clang binary not found for packaging"
          exit 1
        fi
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: clang-android-arm64
        path: declang-android-arm64.tar.gz
        retention-days: 30
