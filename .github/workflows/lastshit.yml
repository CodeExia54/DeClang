name: Build DeClang Android Toolchain (Official Way)

on: workflow_dispatch

jobs:
  build-declang:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout DeClang
      uses: actions/checkout@v4
      with:
        repository: DeNA/DeClang
        ref: Android-v1.0.0
        submodules: recursive
        
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          ninja-build \
          python3 \
          libtinfo5 \
          libncurses5 \
          build-essential \
          git \
          unzip \
          wget
          
    - name: Run Official Build Scripts
      run: |
        echo "=== Running official DeClang build scripts ==="
        cd script
        
        echo "1. Running build.sh..."
        bash build.sh
        
        echo "2. Running build_tools.sh..."
        bash build_tools.sh
        
        echo "3. Running android_release.sh..."
        bash android_release.sh v1.0.0
        
        echo "✅ Official DeClang build complete!"
        
    - name: Test OLLVM
      run: |
        echo "=== Testing built DeClang ==="
        
        # Check if release was created
        if [ -d "../Release-v1.0.0" ]; then
          cd ../Release-v1.0.0
          
          # Set DECLANG_HOME for testing
          export DECLANG_HOME="/tmp/declang-test"
          mkdir -p $DECLANG_HOME
          
          echo "Testing clang from Release-v1.0.0:"
          ./bin/clang --version | head -5
          
          echo 'int main(){return 0;}' > test.c
          
          echo -n "Testing -mllvm -fla: "
          ./bin/clang test.c -o test -mllvm -fla 2>&1 | grep -i "error\|unknown" || echo "✅ works"
          
          echo -n "Testing -mllvm -bcf: "
          ./bin/clang test.c -o test -mllvm -bcf 2>&1 | grep -i "error\|unknown" || echo "✅ works"
          
          echo -n "Testing -mllvm -sub: "
          ./bin/clang test.c -o test -mllvm -sub 2>&1 | grep -i "error\|unknown" || echo "✅ works"
          
          rm -f test.c test
        else
          echo "❌ Release-v1.0.0 directory not found!"
        fi
        
    - name: Create Package
      run: |
        echo "=== Creating package ==="
        
        if [ -d "Release-v1.0.0" ]; then
          # Create minimal package
          mkdir -p declang-android
          cp -r Release-v1.0.0/* declang-android/
          
          # Add setup script as per README
          echo '#!/bin/bash' > declang-android/setup.sh
          echo '# DeClang Setup Script' >> declang-android/setup.sh
          echo '' >> declang-android/setup.sh
          echo 'echo "========================================"' >> declang-android/setup.sh
          echo 'echo "DeClang Android Toolchain Setup"' >> declang-android/setup.sh
          echo 'echo "========================================"' >> declang-android/setup.sh
          echo '' >> declang-android/setup.sh
          echo '# Set DECLANG_HOME as per README' >> declang-android/setup.sh
          echo 'export DECLANG_HOME="${DECLANG_HOME:-$HOME/.DeClang}"' >> declang-android/setup.sh
          echo 'mkdir -p "$DECLANG_HOME"' >> declang-android/setup.sh
          echo '' >> declang-android/setup.sh
          echo '# Copy release to DECLANG_HOME' >> declang-android/setup.sh
          echo 'if [ "$(pwd)" != "$DECLANG_HOME/.DeClang" ]; then' >> declang-android/setup.sh
          echo '    echo "Copying DeClang to $DECLANG_HOME/.DeClang..."' >> declang-android/setup.sh
          echo '    cp -r . "$DECLANG_HOME/.DeClang/"' >> declang-android/setup.sh
          echo 'fi' >> declang-android/setup.sh
          echo '' >> declang-android/setup.sh
          echo '# Add to PATH' >> declang-android/setup.sh
          echo 'export PATH="$DECLANG_HOME/.DeClang/bin:$PATH"' >> declang-android/setup.sh
          echo '' >> declang-android/setup.sh
          echo 'echo ""' >> declang-android/setup.sh
          echo 'echo "Usage:"' >> declang-android/setup.sh
          echo 'echo "  export DECLANG_HOME=\"\$HOME/.DeClang\""' >> declang-android/setup.sh
          echo 'echo "  export PATH=\"\$DECLANG_HOME/.DeClang/bin:\$PATH\""' >> declang-android/setup.sh
          echo 'echo "  clang --version"' >> declang-android/setup.sh
          echo 'echo ""' >> declang-android/setup.sh
          echo 'echo "For Android kernel modules:"' >> declang-android/setup.sh
          echo 'echo "  clang --target=aarch64-linux-android21 -mllvm -fla file.c"' >> declang-android/setup.sh
          echo 'echo "========================================"' >> declang-android/setup.sh
          
          chmod +x declang-android/setup.sh
          
          # Create Android wrapper
          echo '#!/bin/bash' > declang-android/bin/android-clang
          echo '# Android DeClang Wrapper' >> declang-android/bin/android-clang
          echo 'export DECLANG_HOME="${DECLANG_HOME:-$HOME/.DeClang}"' >> declang-android/bin/android-clang
          echo 'mkdir -p "$DECLANG_HOME"' >> declang-android/bin/android-clang
          echo 'exec "$(dirname "$0")/clang" --target=aarch64-linux-android21 "$@"' >> declang-android/bin/android-clang
          
          chmod +x declang-android/bin/android-clang
          
          tar czf declang-android-v1.0.0.tar.gz declang-android/
          echo "✅ Package created: $(du -h declang-android-v1.0.0.tar.gz | cut -f1)"
        else
          echo "❌ Release-v1.0.0 not found"
          exit 1
        fi
        
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: declang-android-v1.0.0
        path: declang-android-v1.0.0.tar.gz
