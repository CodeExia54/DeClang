name: Build Clang with OLLVM for Android final

on: workflow_dispatch

jobs:
  build-clang:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout DeClang
      uses: actions/checkout@v4
      with:
        repository: DeNA/DeClang
        ref: Android-v1.0.0
        submodules: recursive
        
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          ninja-build \
          python3 \
          libtinfo5 \
          libncurses5
          
    - name: Setup OLLVM Symlinks
      run: |
        echo "=== Setting up OLLVM ==="
        
        # Remove old symlinks
        rm -f clang/lib/Driver/DeClangExtraProcess.cpp 2>/dev/null || true
        rm -f llvm/lib/Transforms/AntiHack 2>/dev/null || true
        rm -f llvm/include/llvm/Transforms/AntiHack 2>/dev/null || true
        rm -f tools 2>/dev/null || true
        
        # Link to AntiHackOSS (OLLVM)
        ln -sf ../../../AntiHackOSS/clang/DeClangExtraProcess.cpp clang/lib/Driver/DeClangExtraProcess.cpp
        ln -sf ../../../AntiHackOSS/src llvm/lib/Transforms/AntiHack
        ln -sf ../../../../AntiHackOSS/include llvm/include/llvm/Transforms/AntiHack
        ln -sf AntiHackOSS/tools tools
        
    - name: Build Clang Only
      run: |
        echo "=== Building clang with OLLVM ==="
        
        # Go to llvm source directory
        cd llvm
        
        # Clean build
        rm -rf build && mkdir build
        cd build
        
        # Configure for Android, build only clang - WITH Z3 DISABLED
        cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DLLVM_ENABLE_PROJECTS="clang" \
          -DLLVM_TARGETS_TO_BUILD="AArch64" \
          -DLLVM_DEFAULT_TARGET_TRIPLE="aarch64-linux-android21" \
          -DLLVM_INCLUDE_TESTS=OFF \
          -DLLVM_INCLUDE_EXAMPLES=OFF \
          -DLLVM_ENABLE_Z3_SOLVER=OFF \
          -G "Ninja"
        
        # Build ONLY clang
        ninja clang
        
        echo "✅ Clang build complete!"
        
    - name: Test OLLVM
      run: |
        echo "=== Testing OLLVM ==="
        
        if [ -f "llvm/build/bin/clang" ]; then
          # Set DECLANG_HOME to avoid linker error
          export DECLANG_HOME="/tmp/declang-test"
          mkdir -p $DECLANG_HOME
          
          ./llvm/build/bin/clang --version
          echo ""
          
          # Test OLLVM flags
          echo 'int main(){return 0;}' > test.c
          
          echo "Testing -mllvm -fla:"
          ./llvm/build/bin/clang test.c -o test -mllvm -fla 2>&1 | grep -i "error" || echo "✅ -fla works"
          
          echo "Testing -mllvm -bcf:"
          ./llvm/build/bin/clang test.c -o test -mllvm -bcf 2>&1 | grep -i "error" || echo "✅ -bcf works"
          
          echo "Testing -mllvm -sub:"
          ./llvm/build/bin/clang test.c -o test -mllvm -sub 2>&1 | grep -i "error" || echo "✅ -sub works"
          
          rm -f test.c test
        fi
        
    - name: Package
      run: |
        echo "=== Packaging clang ==="
        
        mkdir -p clang-ollvm/bin
        
        # Copy clang
        cp llvm/build/bin/clang clang-ollvm/bin/
        
        # Android wrapper with DECLANG_HOME set - USING ECHO TO AVOID HEREDOC ISSUES
        echo '#!/bin/bash' > clang-ollvm/bin/android-clang
        echo '# Set DECLANG_HOME to avoid linker error' >> clang-ollvm/bin/android-clang
        echo 'export DECLANG_HOME="${DECLANG_HOME:-$HOME/.DeClang}"' >> clang-ollvm/bin/android-clang
        echo 'mkdir -p "$DECLANG_HOME"' >> clang-ollvm/bin/android-clang
        echo '' >> clang-ollvm/bin/android-clang
        echo '# Execute with Android target' >> clang-ollvm/bin/android-clang
        echo 'exec "$(dirname "$0")/clang" --target=aarch64-linux-android21 "$@"' >> clang-ollvm/bin/android-clang
        
        chmod +x clang-ollvm/bin/android-clang
        
        # Package
        tar czf clang-ollvm-android.tar.gz clang-ollvm/
        echo "✅ Package created: clang-ollvm-android.tar.gz"
        
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: clang-ollvm-android
        path: clang-ollvm-android.tar.gz
