name: Build Clang with OLLVM for Android Fix

on: workflow_dispatch

jobs:
  build-clang:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout DeClang
      uses: actions/checkout@v4
      with:
        repository: DeNA/DeClang
        ref: Android-v1.0.0
        submodules: recursive
        
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          ninja-build \
          python3 \
          libtinfo5 \
          libncurses5
          
    - name: Setup OLLVM Properly
      run: |
        echo "=== Setting up OLLVM ==="
        
        # 1. Create Obfuscation directory in LLVM transforms
        mkdir -p llvm/lib/Transforms/Obfuscation
        
        # 2. Copy OLLVM source files
        cp -r AntiHackOSS/src/* llvm/lib/Transforms/Obfuscation/
        cp -r AntiHackOSS/include/* llvm/include/llvm/Transforms/Obfuscation/
        
        # 3. Create CMakeLists.txt for Obfuscation - USE ECHO TO AVOID YAML ISSUES
        echo 'add_llvm_component_library(LLVMObfuscation' > llvm/lib/Transforms/Obfuscation/CMakeLists.txt
        echo '  BogusControlFlow.cpp' >> llvm/lib/Transforms/Obfuscation/CMakeLists.txt
        echo '  Flattening.cpp' >> llvm/lib/Transforms/Obfuscation/CMakeLists.txt
        echo '  Substitution.cpp' >> llvm/lib/Transforms/Obfuscation/CMakeLists.txt
        echo '  Utils.cpp' >> llvm/lib/Transforms/Obfuscation/CMakeLists.txt
        echo '' >> llvm/lib/Transforms/Obfuscation/CMakeLists.txt
        echo '  ADDITIONAL_HEADER_DIRS' >> llvm/lib/Transforms/Obfuscation/CMakeLists.txt
        echo '  ${LLVM_MAIN_INCLUDE_DIR}/llvm/Transforms/Obfuscation' >> llvm/lib/Transforms/Obfuscation/CMakeLists.txt
        echo '' >> llvm/lib/Transforms/Obfuscation/CMakeLists.txt
        echo '  DEPENDS' >> llvm/lib/Transforms/Obfuscation/CMakeLists.txt
        echo '  intrinsics_gen' >> llvm/lib/Transforms/Obfuscation/CMakeLists.txt
        echo '  )' >> llvm/lib/Transforms/Obfuscation/CMakeLists.txt
        
        # 4. Link DeClang extra process
        ln -sf ../../../AntiHackOSS/clang/DeClangExtraProcess.cpp clang/lib/Driver/DeClangExtraProcess.cpp
        
        echo "OLLVM setup complete!"
        ls -la llvm/lib/Transforms/Obfuscation/
        
    - name: Build Clang with OLLVM
      run: |
        echo "=== Building clang with OLLVM ==="
        cd llvm
        
        mkdir -p build && cd build
        
        # Build ALL of LLVM, not just clang - OLLVM needs LLVM libraries
        cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DLLVM_ENABLE_PROJECTS="clang" \
          -DLLVM_TARGETS_TO_BUILD="AArch64" \
          -DLLVM_DEFAULT_TARGET_TRIPLE="aarch64-linux-android21" \
          -DLLVM_INCLUDE_TESTS=OFF \
          -DLLVM_INCLUDE_EXAMPLES=OFF \
          -DLLVM_ENABLE_Z3_SOLVER=OFF \
          -DLLVM_ENABLE_LIBEDIT=OFF \
          -DLLVM_ENABLE_LIBXML2=OFF \
          -G "Ninja"
        
        # Build clang AND OLLVM passes
        ninja clang LLVMObfuscation
        
        echo "✅ Build complete!"
        
    - name: Verify OLLVM Integration
      run: |
        echo "=== Verifying OLLVM ==="
        cd llvm/build
        
        # Set DECLANG_HOME to avoid warning
        export DECLANG_HOME="/tmp/declang-test"
        mkdir -p $DECLANG_HOME
        
        # Test if OLLVM passes are available
        echo "Testing OLLVM passes..."
        echo 'int main(){return 0;}' > test.c
        
        # This should work if OLLVM is integrated
        echo -n "Testing -mllvm -fla: "
        ./bin/clang -mllvm -fla test.c -o test.o 2>&1 | grep -i "error\|unknown" || echo "✅ works"
        
        echo -n "Testing -mllvm -bcf: "
        ./bin/clang -mllvm -bcf test.c -o test.o 2>&1 | grep -i "error\|unknown" || echo "✅ works"
        
        echo -n "Testing -mllvm -sub: "
        ./bin/clang -mllvm -sub test.c -o test.o 2>&1 | grep -i "error\|unknown" || echo "✅ works"
        
        rm -f test.c test.o
        
    - name: Package
      run: |
        echo "=== Packaging ==="
        mkdir -p clang-ollvm/bin
        cp llvm/build/bin/clang clang-ollvm/bin/
        
        # Create wrapper using echo
        echo '#!/bin/bash' > clang-ollvm/bin/android-clang
        echo 'export DECLANG_HOME="${DECLANG_HOME:-$HOME/.DeClang}"' >> clang-ollvm/bin/android-clang
        echo 'mkdir -p "$DECLANG_HOME"' >> clang-ollvm/bin/android-clang
        echo 'exec "$(dirname "$0")/clang" --target=aarch64-linux-android21 "$@"' >> clang-ollvm/bin/android-clang
        chmod +x clang-ollvm/bin/android-clang
        
        tar czf clang-ollvm-android.tar.gz clang-ollvm/
        echo "✅ Package created!"
        
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: clang-ollvm-android
        path: clang-ollvm-android.tar.gz
