name: Build DeClang Android Toolchain

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  DECLANG_VERSION: "android-build-${{ github.sha }}"

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout DeClang
      uses: actions/checkout@v4
      with:
        repository: DeNA/DeClang
        
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          git \
          python3 \
          unzip
        
    - name: Follow README Build Instructions
      run: |
        echo "=== Following README Build Instructions ==="
        echo "1. git clone https://github.com/DeNA/DeClang ✓"
        echo "2. cd DeClang/script ✓"
        
        cd script
        
        echo "3. bash build.sh"
        bash build.sh
        
        echo "4. bash build_tools.sh"
        bash build_tools.sh
        
        echo "5. bash android_release.sh v1.0.0"
        # Try android_release.sh, fallback to release.sh
        if [ -f "android_release.sh" ]; then
          bash android_release.sh "$DECLANG_VERSION"
        elif [ -f "release.sh" ]; then
          bash release.sh "$DECLANG_VERSION"
        else
          echo "❌ No release script found!"
          exit 1
        fi
        
    - name: Verify Android Build
      run: |
        echo "=== Verifying Android Build ==="
        
        # Look for release directory
        RELEASE_DIR=$(find . -name "Release-*" -type d | head -1)
        
        if [ -n "$RELEASE_DIR" ]; then
          echo "Release directory: $RELEASE_DIR"
          
          # Check for clang
          CLANG_BIN=$(find "$RELEASE_DIR" -name "clang" -type f -executable | head -1)
          
          if [ -n "$CLANG_BIN" ]; then
            echo "✅ Found clang: $CLANG_BIN"
            
            # Test it
            $CLANG_BIN --version | head -3
            
            # Test OLLVM
            echo 'int x;' | $CLANG_BIN -x c -c - -o /dev/null -mllvm -fla 2>/dev/null && \
              echo "✅ OLLVM works" || echo "⚠️ OLLVM may not work"
          fi
        else
          echo "❌ No release directory found"
        fi
        
    - name: Package for Upload
      run: |
        echo "=== Packaging Build ==="
        
        # Find release
        RELEASE_DIR=$(find . -name "Release-*" -type d | head -1)
        
        if [ -n "$RELEASE_DIR" ]; then
          # Create package
          tar czf declang-android-built.tar.gz "$RELEASE_DIR"
          echo "✅ Package created: declang-android-built.tar.gz"
        else
          # Package build directory
          tar czf declang-build.tar.gz build/
        fi
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: declang-android
        path: |
          *.tar.gz
          Release-*/
        retention-days: 90
