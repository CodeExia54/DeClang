name: Build DeClang Public

on: workflow_dispatch

jobs:
  build-declang:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        repository: DeNA/DeClang
        ref: Android-v1.0.0
        submodules: recursive
        fetch-depth: 0
        
    - name: Verify Open Source Version Exists
      run: |
        echo "=== Checking for AntiHackOSS ==="
        ls -la
        echo ""
        
        if [ -d "AntiHackOSS" ]; then
          echo "✅ Found AntiHackOSS (Open Source)"
          ls -la AntiHackOSS/
        else
          echo "❌ AntiHackOSS not found!"
          echo "Available directories:"
          find . -maxdepth 1 -type d | head -20
          exit 1
        fi
        
    - name: Setup Symlinks for OSS Version
      run: |
        echo "=== Setting up OSS symlinks ==="
        
        # Remove any existing symlinks
        rm -f clang/lib/Driver/DeClangExtraProcess.cpp 2>/dev/null || true
        rm -f llvm/lib/Transforms/AntiHack 2>/dev/null || true
        rm -f llvm/include/llvm/Transforms/AntiHack 2>/dev/null || true
        rm -f tools 2>/dev/null || true
        
        # Create symlinks to OSS version
        ln -sf ../../../AntiHackOSS/clang/DeClangExtraProcess.cpp clang/lib/Driver/DeClangExtraProcess.cpp
        ln -sf ../../../AntiHackOSS/src llvm/lib/Transforms/AntiHack
        ln -sf ../../../../AntiHackOSS/include llvm/include/llvm/Transforms/AntiHack
        ln -sf AntiHackOSS/tools tools
        
        echo "✅ Symlinks created"
        
    - name: Build
      run: |
        echo "=== Building DeClang OSS ==="
        
        mkdir -p build
        cd build
        
        # Build configuration (from build.sh)
        cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DLLVM_ENABLE_PROJECTS=clang \
          -DLLVM_ENABLE_DUMP=ON \
          -G "Unix Makefiles" ../llvm
        
        # Build (like build.sh does)
        make llvm-headers
        make -j$(nproc)
        
    - name: Create Android Release
      run: |
        echo "=== Creating Android Release ==="
        
        # Check if tools/android_release.sh exists
        if [ -f "tools/android_release.sh" ]; then
          echo "Running android_release.sh..."
          cd tools
          bash android_release.sh "android-oss-$(date +%Y%m%d)"
        else
          echo "tools/android_release.sh not found, checking script/"
          cd script
          bash android_release.sh "android-oss-$(date +%Y%m%d)"
        fi
        
    - name: Package
      run: |
        echo "=== Packaging ==="
        
        # Look for Release directory
        RELEASE_DIR=$(find . -maxdepth 1 -name "Release-*" -type d | head -1)
        
        if [ -n "$RELEASE_DIR" ]; then
          echo "Found: $RELEASE_DIR"
          
          # Package the release
          tar czf declang-oss-android.tar.gz "$RELEASE_DIR"/
          
          # Also create a simple toolchain
          mkdir -p declang-toolchain/bin
          cp "$RELEASE_DIR"/bin/clang declang-toolchain/bin/ 2>/dev/null || true
          cp "$RELEASE_DIR"/bin/clang++ declang-toolchain/bin/ 2>/dev/null || true
          tar czf declang-toolchain.tar.gz declang-toolchain/
        else
          echo "No Release directory, checking build/bin..."
          mkdir -p declang-toolchain/bin
          find build -name "clang" -type f -executable -exec cp {} declang-toolchain/bin/ \;
          find build -name "clang++" -type f -executable -exec cp {} declang-toolchain/bin/ \;
          tar czf declang-toolchain.tar.gz declang-toolchain/
        fi
        
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: declang-oss
        path: |
          declang-oss-android.tar.gz
          declang-toolchain.tar.gz
          build/bin/clang 2>/dev/null || echo ""
